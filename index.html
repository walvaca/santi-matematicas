<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; base-uri 'self'; form-action 'self'; object-src 'none'">
<meta name="theme-color" content="#0b1130">
<link rel="manifest" href="manifest.json">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Súper Santi: Misión Matemática</title>
<style>
:root{
  --bg:#0b1130; --bg2:#141c3f; --card:#1b2350; --card2:#232b63;
  --border:#333e78; --text:#eef1ff; --muted:#9aa4d6;
  --accent:#4fd1ff; --accent2:#ff8a3d; --green:#3fd67a; --red:#ff5c72; --yellow:#ffd23f;
  --sm-cuerpo:#dfe6fb; --sm-cara:#0b1130;
  --radius:16px; --shadow:0 4px 24px rgba(0,0,0,.4);
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Roboto,sans-serif;background:var(--bg);color:var(--text);min-height:100vh;font-size:15.5px}
button{font-family:inherit;cursor:pointer;border:none;font-size:14px;color:inherit}
input,select{font-family:inherit;font-size:15px;background:var(--bg2);border:1px solid var(--border);color:var(--text);border-radius:8px;padding:10px 12px;outline:none}
input:focus,select:focus{border-color:var(--accent)}
input[type=checkbox]{width:20px;height:20px}
select{max-width:150px}
h1{font-size:19px}
h2{font-size:17px;margin-bottom:6px}
p{line-height:1.5}
.sm-muted{color:var(--muted);font-size:12.5px}

#app{max-width:480px;margin:0 auto;min-height:100vh;display:flex;flex-direction:column}
.sm-pantalla{padding:16px 14px 10px;flex:1;display:flex;flex-direction:column;animation:smFadeIn .25s ease}
@keyframes smFadeIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}

.btn{background:var(--accent2);color:#1a1204;padding:13px 18px;border-radius:12px;font-weight:700;transition:opacity .15s,transform .1s;width:100%}
.btn:active{transform:scale(.97)}
.btn:disabled{opacity:.45;cursor:default}
.btn-sec{background:var(--card2);color:var(--text);border:1px solid var(--border)}
.btn-peligro{background:rgba(255,92,114,.15);color:var(--red);border:1px solid var(--red)}
.sm-btn-icono{background:var(--card2);color:var(--text);width:38px;height:38px;border-radius:10px;font-size:18px;display:flex;align-items:center;justify-content:center;flex-shrink:0}

/* ---------- mascota Cosmo ---------- */
.sm-mascota-svg{width:110px;height:110px;display:block;margin:0 auto;flex-shrink:0}
.sm-mascota-svg.sm-mascota-media{width:76px;height:76px;margin:0}
.sm-mascota-svg.sm-mascota-chica{width:56px;height:56px;margin:0 auto 6px}
.sm-chispa{fill:var(--yellow);animation:smTwinkle 1.4s ease-in-out infinite}
.sm-chispa2{animation-delay:.3s}
.sm-chispa3{animation-delay:.6s}
@keyframes smTwinkle{0%,100%{opacity:.25}50%{opacity:1}}

/* ---------- inicio ---------- */
.sm-inicio-header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sm-inicio-header h1{font-size:17px;line-height:1.3}
.sm-stats-fila{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px}
.sm-stats-fila.sm-centrado{justify-content:center}
.sm-stat-chip{background:var(--card);border:1px solid var(--border);border-radius:20px;padding:7px 13px;font-size:12.5px;color:var(--muted)}
.sm-stat-chip b{color:var(--text)}

.sm-planetas-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:10px}
.sm-planeta-card{background:var(--card);border:1px solid var(--border);border-top:3px solid var(--color-planeta,var(--accent));border-radius:var(--radius);padding:14px 10px;display:flex;flex-direction:column;align-items:center;text-align:center;gap:4px;transition:transform .1s}
.sm-planeta-card:active{transform:scale(.96)}
.sm-planeta-card.bloqueado{opacity:.65;border-top-color:var(--border)}
.sm-planeta-card.bloqueado:active{transform:none}
.sm-planeta-emoji{font-size:32px}
.sm-planeta-nombre{font-weight:700;font-size:14.5px}
.sm-planeta-subtitulo{color:var(--muted);font-size:11px;min-height:26px}
.sm-planeta-barra{width:100%;height:6px;background:var(--bg2);border-radius:4px;overflow:hidden;margin-top:4px}
.sm-planeta-barra span{display:block;height:100%;background:var(--color-planeta,var(--accent))}
.sm-planeta-estrellas{font-size:11px;color:var(--muted)}

/* ---------- barra inferior ---------- */
.sm-navbar{position:sticky;bottom:0;display:flex;background:var(--card);border-top:1px solid var(--border);margin:16px -14px -10px;padding:8px 0 max(8px,env(safe-area-inset-bottom))}
.sm-navbar-btn{flex:1;background:transparent;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted);font-size:11px;padding:4px}
.sm-navbar-btn span{font-size:20px}
.sm-navbar-btn.activo{color:var(--accent)}

/* ---------- mundo / niveles ---------- */
.sm-header-mundo{display:flex;align-items:center;gap:12px;margin-bottom:14px}
.sm-header-mundo>div{flex:1;min-width:0}
.sm-btn-leccion{margin-bottom:14px;background:var(--card2);color:var(--text);border:1px solid var(--color-planeta,var(--border))}
.sm-niveles-lista{display:flex;flex-direction:column}
.sm-nivel-fila{display:flex;align-items:center;gap:8px}
.sm-nivel-conector{width:3px;height:14px;background:var(--border);margin-left:27px}
.sm-nivel-conector.activo{background:var(--color-planeta,var(--accent))}
.sm-nivel-nodo{flex:1;min-width:0;display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--color-planeta,var(--accent));border-radius:12px;padding:12px;text-align:left}
.sm-btn-reset-nivel{flex-shrink:0;width:38px;height:38px;border-radius:10px;background:var(--card2);border:1px solid var(--border);color:var(--muted);font-size:17px}
.sm-nivel-nodo.bloqueado{opacity:.45}
.sm-nivel-nodo.actual{box-shadow:0 0 0 2px var(--color-planeta,var(--accent)),0 0 14px rgba(79,209,255,.35);animation:smLatido 1.8s ease-in-out infinite}
@keyframes smLatido{0%,100%{transform:scale(1)}50%{transform:scale(1.015)}}
.sm-nivel-icono{font-size:20px;width:30px;text-align:center;flex-shrink:0}
.sm-nivel-info{display:flex;flex-direction:column;gap:4px}
.sm-nivel-nombre{font-weight:600;font-size:14px}
.sm-nivel-fila-meta{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.sm-estrella{color:var(--border);font-size:15px}
.sm-estrella.llena{color:var(--yellow)}
.sm-dificultad{display:flex;align-items:center;gap:5px;font-size:10.5px;color:var(--muted)}
.sm-dif-pips{display:flex;gap:2px}
.sm-dif-pip{width:6px;height:6px;border-radius:50%;background:var(--border);display:block}
.sm-dif-pip.llena{background:var(--color-dif,var(--accent))}

/* ---------- lección ---------- */
.sm-leccion-tarjeta{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;margin-bottom:14px}
.sm-leccion-tarjeta p{color:var(--text);font-size:14.5px}
.sm-leccion-visual{margin-top:12px}
.sm-puntos-fila{display:flex;justify-content:center;gap:6px;margin-bottom:16px}
.sm-punto{width:7px;height:7px;border-radius:50%;background:var(--border)}
.sm-punto.activo{background:var(--accent);width:18px;border-radius:4px}
.sm-leccion-botones{display:flex;gap:10px;margin-top:auto}

/* ---------- juego ---------- */
.sm-pantalla-juego{padding-bottom:20px}
.sm-barra-superior{display:flex;align-items:center;gap:10px;margin-bottom:16px}
.sm-progreso-zona{flex:1}
.sm-progreso-texto{font-size:11.5px;color:var(--muted);margin-bottom:4px}
.sm-progreso-barra{height:7px;background:var(--card2);border-radius:4px;overflow:hidden}
.sm-progreso-barra span{display:block;height:100%;background:var(--accent2)}
.sm-timer{font-weight:700;font-size:16px}
.sm-timer.urgente{color:var(--red);animation:smPulso .6s infinite}
@keyframes smPulso{0%,100%{opacity:1}50%{opacity:.4}}
.sm-racha-chip{font-weight:700;color:var(--accent2);font-size:14px;min-width:34px;text-align:right}
.sm-vidas-chip{font-size:14px;letter-spacing:1px;white-space:nowrap}
.sm-timer-pregunta{position:absolute;top:10px;right:14px;font-weight:700;font-size:12.5px;color:var(--accent2);background:var(--card2);border-radius:20px;padding:3px 9px}

.sm-pregunta-card{position:relative;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px 16px;text-align:center;margin-bottom:16px}
.sm-pregunta-texto{font-size:21px;font-weight:700;line-height:1.4}
.sm-pregunta-visual{display:flex;justify-content:center;margin-bottom:10px}
.sm-puntos-popup{position:absolute;top:6px;right:14px;color:var(--yellow);font-weight:800;font-size:15px;pointer-events:none;animation:smFlotar .9s ease forwards}
@keyframes smFlotar{0%{opacity:0;transform:translateY(6px) scale(.8)}20%{opacity:1;transform:translateY(-2px) scale(1.1)}80%{opacity:1}100%{opacity:0;transform:translateY(-26px) scale(1)}}

.sm-opciones{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sm-opcion-btn{background:var(--card2);border:2px solid var(--border);border-radius:12px;padding:16px 8px;font-size:17px;font-weight:600;text-align:center}
.sm-opcion-btn:disabled{opacity:.6}
.sm-opcion-btn.correcta{border-color:var(--green);background:rgba(63,214,122,.18);color:var(--green);opacity:1}
.sm-opcion-btn.incorrecta{border-color:var(--red);background:rgba(255,92,114,.18);color:var(--red);opacity:1}

.sm-numero-zona{display:flex;flex-direction:column;align-items:center;gap:14px}
.sm-numero-display{min-width:140px;min-height:52px;background:var(--card2);border:2px solid var(--border);border-radius:12px;display:flex;align-items:center;justify-content:center;font-size:28px;font-weight:700;letter-spacing:2px}
.sm-teclado{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;width:100%;max-width:280px}
.sm-tecla{background:var(--card2);border:1px solid var(--border);border-radius:12px;padding:16px 0;font-size:19px;font-weight:700}
.sm-tecla:disabled{opacity:.5}
.sm-tecla-ok{background:var(--green);color:#04220f}

.sm-feedback-panel{margin-top:14px;padding:14px;border-radius:var(--radius);border:1px solid var(--border);background:var(--card)}
.sm-feedback-panel.correcta{border-color:var(--green);background:rgba(63,214,122,.1)}
.sm-feedback-panel.incorrecta{border-color:var(--red);background:rgba(255,92,114,.1)}
.sm-feedback-panel p{font-weight:600;margin-bottom:6px}
.sm-explicacion{font-weight:400!important;color:var(--muted);font-size:13px}
.sm-feedback-panel .btn{margin-top:8px}

/* ---------- resultado ---------- */
.sm-pantalla-resultado{text-align:center;align-items:center;gap:6px;position:relative}
.sm-pantalla-resultado h1{margin-top:10px}
.sm-resultado-estrellas{font-size:44px;letter-spacing:10px;margin:6px 0}
.sm-arcade-puntaje-final{font-size:48px;font-weight:800;color:var(--accent2);margin:4px 0}
.sm-resultado-estrellas .sm-estrella.llena{animation:smPop .4s ease backwards}
.sm-resultado-estrellas .sm-estrella:nth-child(2){animation-delay:.12s}
.sm-resultado-estrellas .sm-estrella:nth-child(3){animation-delay:.24s}
@keyframes smPop{0%{transform:scale(0)}60%{transform:scale(1.25)}100%{transform:scale(1)}}
.sm-record{color:var(--yellow);font-weight:700;font-size:13px}
.sm-logros-nuevos{display:flex;flex-direction:column;gap:8px;width:100%;margin:10px 0}
.sm-logro-chip{background:var(--card);border:1px solid var(--yellow);border-radius:12px;padding:10px 12px;text-align:left;font-size:13px}
.sm-resultado-botones{display:flex;flex-direction:column;gap:10px;width:100%;margin-top:16px}
.sm-confeti-zona{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:50}
.sm-confeti-pieza{position:absolute;top:-12px;width:9px;height:14px;opacity:.9;border-radius:2px;animation-name:smCaer;animation-timing-function:ease-in;animation-fill-mode:forwards}
@keyframes smCaer{to{transform:translateY(112vh) rotate(360deg);opacity:0}}

/* ---------- logros ---------- */
.sm-logros-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.sm-logro-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:14px 10px;text-align:center;opacity:.4;display:flex;flex-direction:column;align-items:center;gap:4px}
.sm-logro-card.obtenido{opacity:1;border-color:var(--yellow)}
.sm-logro-icono{font-size:28px}
.sm-logro-nombre{font-weight:700;font-size:13px}
.sm-logro-desc{font-size:11px;color:var(--muted)}

/* ---------- arcade: menú ---------- */
.sm-arcade-lista{display:flex;flex-direction:column;gap:12px}
.sm-arcade-aviso{text-align:center;margin:-4px 0 12px;color:var(--accent)}
.sm-arcade-card{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:22px 18px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:8px}
.sm-arcade-emoji{font-size:44px}
.sm-arcade-card p{color:var(--muted);font-size:13.5px;margin-bottom:6px}
.sm-arcade-card .btn{margin-top:8px;width:auto;padding-left:24px;padding-right:24px}

/* ---------- arcade: elegir dificultad ---------- */
.sm-dificultad-arcade-lista{display:flex;flex-direction:column;gap:10px}
.sm-dificultad-arcade-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--border);border-radius:var(--radius);padding:14px 16px;text-align:left}
.sm-dificultad-arcade-emoji{font-size:30px;flex-shrink:0}
.sm-dificultad-arcade-info{display:flex;flex-direction:column;gap:3px}
.sm-dificultad-arcade-nombre{font-weight:700;font-size:15px}
.sm-dificultad-arcade-principiante{border-left-color:var(--green)}
.sm-dificultad-arcade-intermedio{border-left-color:var(--accent)}
.sm-dificultad-arcade-experto{border-left-color:var(--accent2)}
.sm-dificultad-arcade-maestro{border-left-color:var(--yellow)}

/* ---------- reto diario ---------- */
.sm-planeta-barra.sm-barra-xp span{background:var(--yellow)}
.sm-planeta-card.bloqueado .sm-planeta-subtitulo{color:var(--yellow)}
.sm-nivel-llave{display:block;font-size:11.5px;color:var(--yellow);margin-top:4px}
.sm-modal-planeta{position:relative;overflow:hidden;text-align:center}
.sm-modal-planeta h2{margin:6px 0}
.sm-modal-planeta-emojis{font-size:44px}
.sm-hito100{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;overflow:hidden;background:radial-gradient(circle at 50% 40%,#3a1a4f 0%,#140a2e 55%,#05030f 100%);animation:sm-h100-entra .5s ease-out both}
.sm-hito100.saliendo{animation:sm-h100-sale .4s ease-in both}
@keyframes sm-h100-entra{from{opacity:0}to{opacity:1}}
@keyframes sm-h100-sale{to{opacity:0;transform:scale(1.05)}}
.sm-h100-rayos{position:absolute;left:50%;top:38%;width:900px;height:900px;margin:-450px 0 0 -450px;background:repeating-conic-gradient(rgba(255,210,63,.13) 0 10deg,transparent 10deg 20deg);border-radius:50%;animation:sm-h100-gira 14s linear infinite;mask:radial-gradient(circle,#000 20%,transparent 65%);-webkit-mask:radial-gradient(circle,#000 20%,transparent 65%)}
@keyframes sm-h100-gira{to{transform:rotate(360deg)}}
.sm-h100-fuegos,.sm-h100-confeti{position:absolute;inset:0;pointer-events:none}
.sm-h100-chispa{position:absolute;width:6px;height:6px;border-radius:50%;box-shadow:0 0 8px currentColor;animation:sm-h100-chispa 1.2s cubic-bezier(.15,.7,.3,1) forwards}
@keyframes sm-h100-chispa{0%{transform:translate(0,0) scale(1);opacity:1}80%{opacity:1}100%{transform:translate(var(--dx),calc(var(--dy) + 40px)) scale(.3);opacity:0}}
.sm-h100-contenido{position:relative;display:flex;flex-direction:column;align-items:center;gap:10px;padding:20px 16px;text-align:center;max-width:380px}
.sm-h100-llama{position:relative;width:150px;height:185px;animation:sm-h100-llama-in 1.1s cubic-bezier(.2,1.6,.4,1) both,sm-h100-flama 1.3s ease-in-out 1.1s infinite;transform-origin:50% 100%;filter:drop-shadow(0 0 28px rgba(255,138,61,.8))}
.sm-h100-llama svg{width:100%;height:100%;display:block}
@keyframes sm-h100-llama-in{0%{transform:scale(0) rotate(-20deg);opacity:0}100%{transform:scale(1) rotate(0);opacity:1}}
@keyframes sm-h100-flama{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.05,.96) rotate(-2deg)}60%{transform:scale(.96,1.05) rotate(2deg)}}
.sm-h100-num{position:absolute;left:0;right:0;bottom:22px;font-size:46px;font-weight:900;color:#fff;text-shadow:0 3px 8px rgba(120,30,0,.8)}
.sm-h100-num.listo{animation:sm-h100-pop .5s ease-out}
@keyframes sm-h100-pop{50%{transform:scale(1.35)}}
.sm-h100-titulo{font-size:30px;font-weight:900;letter-spacing:.5px;background:linear-gradient(90deg,#ffd23f,#ff8a3d,#ff6fae,#ffd23f);background-size:300% 100%;-webkit-background-clip:text;background-clip:text;color:transparent;animation:sm-h100-brillo 2.5s linear infinite,sm-h100-sube .6s ease-out 1.2s both}
@keyframes sm-h100-brillo{to{background-position:300% 0}}
@keyframes sm-h100-sube{from{opacity:0;transform:translateY(20px)}to{opacity:1;transform:none}}
.sm-h100-sub{color:var(--text);font-size:16px;animation:sm-h100-sube .6s ease-out 1.6s both}
.sm-h100-sub b{color:var(--yellow)}
.sm-h100-insignia{display:flex;flex-direction:column;align-items:center;gap:2px;background:rgba(255,210,63,.12);border:2px solid var(--yellow);border-radius:16px;padding:10px 18px;font-size:26px;animation:sm-h100-sube .6s ease-out 2.1s both,sm-h100-pulso 2s ease-in-out 2.7s infinite}
.sm-h100-insignia b{font-size:15px;color:var(--yellow)}
.sm-h100-insignia small{font-size:12px;color:var(--muted)}
@keyframes sm-h100-pulso{50%{box-shadow:0 0 22px rgba(255,210,63,.55)}}
.sm-h100-cosmo{animation:sm-h100-sube .6s ease-out 2.4s both,sm-h100-salta .8s ease-in-out 3s infinite}
@keyframes sm-h100-salta{50%{transform:translateY(-10px)}}
.sm-h100-btn{max-width:280px;animation:sm-h100-sube .5s ease-out 3s both}
@media (prefers-reduced-motion:reduce){.sm-h100-rayos,.sm-h100-llama,.sm-h100-titulo,.sm-h100-cosmo,.sm-h100-insignia{animation:none}.sm-h100-sub,.sm-h100-btn{animation:none}}
.sm-racha-widget{display:block;width:100%;text-align:left;background:linear-gradient(160deg,var(--card2),var(--card));border:2px solid var(--border);border-radius:18px;padding:14px;margin-bottom:14px;color:var(--text);box-shadow:var(--shadow)}
.sm-racha-widget.cumplido{border-color:var(--accent2)}
.sm-racha-widget.peligro{border-color:var(--red);animation:sm-rw-pulso 1.6s ease-in-out infinite}
@keyframes sm-rw-pulso{0%,100%{box-shadow:0 0 0 0 rgba(255,92,114,.45)}50%{box-shadow:0 0 0 7px rgba(255,92,114,0)}}
.sm-rw-top{display:flex;align-items:center;gap:14px;margin-bottom:12px}
.sm-rw-llama{position:relative;width:64px;height:78px;flex-shrink:0}
.sm-rw-llama-svg{width:100%;height:100%;display:block}
.sm-rw-llama-ext{fill:#4a5288}.sm-rw-llama-int{fill:#6b73a8}
.sm-rw-llama.encendida .sm-rw-llama-ext{fill:var(--accent2)}
.sm-rw-llama.encendida .sm-rw-llama-int{fill:var(--yellow)}
.sm-rw-llama.encendida .sm-rw-llama-svg{animation:sm-rw-flama 1.4s ease-in-out infinite;transform-origin:50% 100%;filter:drop-shadow(0 0 10px rgba(255,138,61,.55))}
@keyframes sm-rw-flama{0%,100%{transform:scale(1,1) rotate(0)}30%{transform:scale(1.04,.97) rotate(-2deg)}60%{transform:scale(.97,1.04) rotate(2deg)}}
.sm-rw-num{position:absolute;left:0;right:0;bottom:8px;text-align:center;font-size:22px;font-weight:800;color:#fff;text-shadow:0 2px 4px rgba(0,0,0,.5)}
.sm-rw-texto{display:flex;flex-direction:column;gap:4px;min-width:0}
.sm-rw-texto b{font-size:19px;line-height:1.2}
.sm-racha-widget.cumplido .sm-rw-texto b{color:var(--accent2)}
.sm-rw-texto small{color:var(--muted);font-size:13px}
.sm-rw-semana{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;margin-bottom:12px}
.sm-rw-dia{display:flex;flex-direction:column;align-items:center;gap:4px;font-size:12px;color:var(--muted);font-weight:700}
.sm-rw-dia i{font-style:normal;width:30px;height:30px;border-radius:50%;display:flex;align-items:center;justify-content:center;background:var(--bg2);border:2px solid var(--border);color:#1a1204;font-size:15px;font-weight:900}
.sm-rw-dia.hecho i{background:var(--accent2);border-color:var(--accent2)}
.sm-rw-dia.hoy span{color:var(--text)}
.sm-rw-dia.hoy i{border-color:var(--accent2);border-style:dashed}
.sm-rw-dia.hoy.hecho i{border-style:solid;box-shadow:0 0 10px rgba(255,138,61,.6)}
.sm-rw-dia.futuro{opacity:.45}
.sm-rw-progreso{display:flex;align-items:center;gap:10px;margin-bottom:8px}
.sm-rw-progreso .sm-planeta-barra{flex:1;margin:0}
.sm-rw-progreso small{color:var(--muted);font-size:12.5px;white-space:nowrap}
.sm-rw-progreso small b{color:var(--text)}
.sm-rw-pie{display:flex;flex-wrap:wrap;justify-content:space-between;gap:4px 10px;font-size:12.5px;color:var(--muted)}
.sm-rw-cuenta b{color:var(--accent2)}
.sm-racha-widget.peligro .sm-rw-cuenta b{color:var(--red)}
.sm-rw-hito b{color:var(--yellow)}
.sm-rw-dia.rescatado i{background:rgba(79,209,255,.15);border-color:var(--accent);font-size:14px}
.sm-rescate-card{border-color:var(--red);animation:sm-rw-pulso 1.6s ease-in-out infinite}
.sm-rescate-card .sm-rw-texto b{color:var(--text)}
.sm-rescate-card .sm-rw-texto small b{color:var(--red)}
.sm-rw-llama-rota .sm-rw-llama-svg{opacity:.55;transform:rotate(-8deg)}
.sm-rescate-btn{display:block;text-align:center;margin:4px 0 10px;background:var(--red);color:#fff}
.sm-rescate-card .sm-rw-cuenta b{color:var(--red)}
.sm-rescate-reglas{background:var(--card);border:1px solid var(--border);border-radius:14px;padding:12px 14px;margin:14px 0;text-align:left;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion:reduce){.sm-rescate-card{animation:none}}
@media (prefers-reduced-motion:reduce){.sm-racha-widget.peligro,.sm-rw-llama.encendida .sm-rw-llama-svg{animation:none}}
.sm-reto-diario{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--accent2);border-radius:12px;padding:10px 12px;margin-bottom:14px}
.sm-reto-diario.cumplido{border-color:var(--green)}
.sm-reto-diario-emoji{font-size:26px;flex-shrink:0}
.sm-barra-racha span{background:var(--accent2)}
.sm-reto-chip{border-color:var(--accent2)!important}

/* ---------- memoria espacial ---------- */
.sm-memoria-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.sm-carta-memoria{aspect-ratio:1/1;background:var(--card2);border:2px solid var(--border);border-radius:10px;font-size:14px;font-weight:700;display:flex;align-items:center;justify-content:center;padding:4px;text-align:center;transition:transform .15s}
.sm-carta-memoria:disabled{opacity:1}
.sm-carta-memoria.volteada{background:var(--card);border-color:var(--accent);color:var(--accent)}
.sm-carta-memoria.encontrada{background:rgba(63,214,122,.18);border-color:var(--green);color:var(--green)}

/* ---------- escalera numérica ---------- */
.sm-escalera-info{display:flex;flex-direction:column;gap:2px;text-align:center;margin-bottom:4px;font-weight:700}
.sm-escalera-numero{color:var(--accent)}
.sm-escalera-instruccion{text-align:center;margin:0 0 16px}
.sm-escalera-tiles{display:flex;flex-wrap:wrap;gap:12px;justify-content:center}
.sm-escalera-tiles.sm-shake{animation:smShake .35s}
.sm-tile-escalera{width:64px;height:64px;border-radius:14px;background:var(--card2);border:2px solid var(--border);font-size:26px;font-weight:800}
.sm-tile-escalera.acierto{background:rgba(63,214,122,.25);border-color:var(--green);color:var(--green)}
.sm-tile-escalera:disabled{opacity:.5}

/* ---------- agujeros negros ---------- */
.sm-agujeros-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;max-width:320px;margin:0 auto}
.sm-hueco{aspect-ratio:1/1;border-radius:50%;background:radial-gradient(circle at 50% 40%,var(--card2),var(--bg2) 75%);border:2px solid var(--border);font-size:20px;font-weight:800;display:flex;align-items:center;justify-content:center;color:var(--muted);transition:transform .1s}
.sm-hueco.activo{border-color:var(--accent);color:var(--text);background:radial-gradient(circle at 50% 40%,var(--card2),rgba(79,209,255,.25) 90%);transform:scale(1.06)}
.sm-hueco.acierto{border-color:var(--green);background:rgba(63,214,122,.3);color:var(--green)}
.sm-hueco.fallo{border-color:var(--red);background:rgba(255,92,114,.3);color:var(--red)}

/* ---------- esquiva asteroides ---------- */
.sm-asteroides-pista{position:relative;flex:1;min-height:56vh;display:flex;border:1px solid var(--border);border-radius:var(--radius);overflow:hidden;background:radial-gradient(circle at 50% 0%,rgba(79,209,255,.08),transparent 60%)}
.sm-asteroides-pista.sm-shake{animation:smShake .35s}
.sm-carril{flex:1;border-right:1px dashed var(--border)}
.sm-carril:last-child{border-right:none}
.sm-asteroide{position:absolute;transform:translate(-50%,-50%);min-width:42px;padding:8px 6px;text-align:center;background:var(--card2);border:2px solid var(--border);border-radius:10px;font-weight:700;font-size:13px}
.sm-nave{position:absolute;bottom:6px;transform:translateX(-50%);font-size:30px;transition:left .12s ease}

/* ---------- invasores numéricos ---------- */
.sm-pantalla-invasores{padding-bottom:10px}
.sm-invasores-hud{flex:1;display:flex;justify-content:space-between;align-items:center;font-size:14px;font-weight:700}
.sm-invasores-regla{background:var(--card2);border:1px solid var(--accent2);color:var(--accent2);border-radius:10px;padding:9px 12px;text-align:center;font-weight:700;font-size:13.5px;margin-bottom:10px}
.sm-regla-flash{animation:smReglaFlash .6s ease}
@keyframes smReglaFlash{0%{transform:scale(1.06);background:rgba(255,138,61,.35)}100%{transform:scale(1)}}
.sm-invasores-area{position:relative;overflow:hidden;flex:1;min-height:52vh;background:radial-gradient(circle at 50% 0%,rgba(79,209,255,.08),transparent 60%);border:1px solid var(--border);border-radius:var(--radius)}
.sm-invasores-area.sm-shake{animation:smShake .35s}
@keyframes smShake{0%,100%{transform:translateX(0)}25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.sm-nave{position:absolute;min-width:46px;padding:10px 8px;background:var(--card2);border:2px solid var(--border);border-radius:10px;color:var(--text);font-weight:700;font-size:14px;transform:translateX(-50%)}
.sm-nave.sm-nave-acierto{border-color:var(--green);background:rgba(63,214,122,.3);animation:smExplota .22s ease forwards}
.sm-nave.sm-nave-error{border-color:var(--red);background:rgba(255,92,114,.3);animation:smExplota .22s ease forwards}
@keyframes smExplota{to{transform:translateX(-50%) scale(1.5);opacity:0}}
.sm-puntos-popup-arcade{position:absolute;color:var(--yellow);font-weight:800;font-size:15px;pointer-events:none;transform:translateX(-50%);animation:smFlotar .7s ease forwards}

/* ---------- ajustes ---------- */
.sm-ajustes-lista{display:flex;flex-direction:column;gap:16px;margin-top:6px}
.sm-campo{display:flex;flex-direction:column;gap:6px;font-size:13px;color:var(--muted)}
.sm-campo input[type=text]{color:var(--text)}
.sm-campo-fila{flex-direction:row;align-items:center;justify-content:space-between}

/* ---------- visuales de fracciones / álgebra / arreglos ---------- */
.sm-pizza{width:110px;height:110px;border-radius:50%;border:3px solid var(--border);margin:0 auto}
.sm-fila-pizzas{display:flex;gap:16px;justify-content:center}
.sm-grid-puntos{display:grid;grid-template-columns:repeat(var(--cols),1fr);gap:6px;width:max-content;margin:0 auto}
.sm-grid-puntos span{width:13px;height:13px;border-radius:50%;background:var(--accent);display:block}
.sm-balanza{display:flex;align-items:center;justify-content:center;gap:0;margin:0 auto}
.sm-balanza-plato{background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:12px 16px;font-weight:700;font-size:16px}
.sm-balanza-barra{width:28px;height:4px;background:var(--muted)}
.sm-emoji-fila{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;font-size:26px;max-width:260px;margin:8px auto 0;line-height:1.3}
.sm-grupos-fila{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin-top:8px}
.sm-grupo{display:flex;flex-wrap:wrap;gap:2px;max-width:92px;background:var(--card2);border:2px solid var(--border);border-radius:10px;padding:8px;font-size:19px;justify-content:center}
.sm-grupo-signo{font-size:22px;font-weight:700;color:var(--muted)}
.sm-recta{display:flex;align-items:flex-end;justify-content:flex-start;gap:6px;overflow-x:auto;padding:10px 6px;margin-top:8px}
.sm-recta-punto{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:22px;flex-shrink:0}
.sm-recta-punto span{width:8px;height:8px;border-radius:50%;background:var(--border)}
.sm-recta-punto b{font-size:11px;color:var(--muted);font-weight:600}
.sm-recta-punto.activo span{background:var(--accent);width:12px;height:12px}
.sm-recta-punto.activo b{color:var(--accent);font-weight:800}
.sm-bloques-fila{display:flex;gap:16px;justify-content:center;align-items:flex-end;flex-wrap:wrap;margin-top:8px}
.sm-bloque-col{display:flex;flex-direction:column;align-items:center;gap:6px}
.sm-bloque-col span{font-size:11px;color:var(--muted)}
.sm-bloque-grupo{display:flex;gap:3px;flex-wrap:wrap;max-width:64px;justify-content:center}
.sm-bloque-cent{width:20px;height:20px;background:var(--accent2);border-radius:4px}
.sm-bloque-dec{width:8px;height:20px;background:var(--accent);border-radius:3px}
.sm-bloque-uni{width:9px;height:9px;background:var(--yellow);border-radius:2px}
.sm-leccion-truco{margin-top:10px;background:var(--card2);border:1px dashed var(--accent);border-radius:10px;padding:10px 12px;font-size:13.5px;color:var(--text);text-align:left}

/* ---------- quiz final ---------- */
.sm-quiz-zona{margin-top:4px}
.sm-quiz-nodo{border-left:4px solid var(--yellow);background:linear-gradient(135deg,var(--card),rgba(255,210,63,.08))}
.sm-quiz-nota{font-size:11px;color:var(--muted);margin-top:2px}

/* ---------- metas y premios ---------- */
.sm-meta-mini{display:flex;align-items:center;gap:10px;width:100%;background:var(--card);border:1px solid var(--yellow);border-radius:12px;padding:10px 12px;margin-bottom:14px;text-align:left}
.sm-meta-mini-emoji{font-size:26px;flex-shrink:0}
.sm-meta-mini-info{flex:1;display:flex;flex-direction:column;gap:4px;font-size:12.5px}
.sm-metas-lista{display:flex;flex-direction:column;gap:10px}
.sm-meta-card{display:flex;align-items:center;gap:12px;background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:12px 14px}
.sm-meta-card.lista{border-color:var(--yellow);box-shadow:0 0 12px rgba(255,210,63,.25)}
.sm-meta-card.reclamada{opacity:.55}
.sm-cobertura-card:not(.lista){border-color:var(--accent)}
.sm-meta-emoji{font-size:28px;flex-shrink:0}
.sm-meta-info{flex:1;display:flex;flex-direction:column;gap:5px}
.sm-meta-nombre{font-weight:700;font-size:14px}
.sm-meta-puntos{font-size:11.5px;color:var(--muted)}
.sm-meta-estado{font-size:20px}
.sm-metas-ayuda{text-align:center;margin-top:14px;font-size:12px;line-height:1.5}
.sm-meta-chip{border-color:var(--yellow)!important}

/* ---------- gestión de metas (ajustes) ---------- */
.sm-metas-admin-lista{display:flex;flex-direction:column;gap:6px;margin-bottom:10px}
.sm-meta-admin-fila{display:flex;align-items:center;justify-content:space-between;gap:8px;background:var(--bg2);border-radius:8px;padding:8px 10px;font-size:12.5px}
.sm-meta-admin-botones{display:flex;gap:6px;flex-shrink:0}
.sm-btn-mini{width:auto;padding:6px 10px;font-size:11.5px;border-radius:8px}
.sm-meta-form{display:flex;flex-direction:column;gap:8px;background:var(--bg2);border-radius:10px;padding:10px}
.sm-meta-form-fila{display:flex;gap:8px}
.sm-meta-form-fila input:first-child{flex:0 0 60px;text-align:center}
.sm-meta-form-fila input:last-child{flex:1}

/* ---------- overlay / modal ---------- */
.sm-overlay{position:fixed;inset:0;background:rgba(5,8,25,.7);display:flex;align-items:center;justify-content:center;z-index:100;padding:20px}
.sm-modal{background:var(--card);border:1px solid var(--border);border-radius:var(--radius);padding:20px;max-width:340px;width:100%;text-align:center;box-shadow:var(--shadow)}
.sm-modal p{margin-bottom:4px}
.sm-modal-botones{display:flex;gap:10px;margin-top:16px}
.sm-modal-botones button{flex:1}
.sm-modal-explicacion{max-width:360px}
.sm-modal-explicacion h2{font-size:16px;margin:6px 0 12px}
.sm-explicacion-pasos{text-align:left;padding-left:20px;display:flex;flex-direction:column;gap:8px;font-size:13.5px;line-height:1.5}
.sm-explicacion-ejemplo{background:var(--bg2);border-radius:8px;padding:10px 12px;margin-top:12px;font-size:13px;color:var(--accent);text-align:left}
.sm-modal-explicacion .btn{margin-top:16px}

/* ---------- profesor virtual (botón de ayuda en el juego) ---------- */
.sm-btn-profesor{width:auto;margin:0 auto 14px;display:block;background:transparent;border:1px dashed var(--border);color:var(--muted);padding:7px 14px;border-radius:20px;font-size:12px}
.sm-btn-profesor:active{opacity:.7}

/* ---------- Centro de Tablas ---------- */
.sm-tabla-elegir-lista{display:flex;flex-direction:column;gap:10px}
.sm-tabla-elegir-card{display:flex;align-items:center;gap:14px;background:var(--card);border:1px solid var(--border);border-left:4px solid var(--accent);border-radius:var(--radius);padding:12px 14px;text-align:left}
.sm-tabla-elegir-num{font-size:26px;font-weight:800;color:var(--accent);width:34px;text-align:center;flex-shrink:0}
.sm-tabla-elegir-info{display:flex;flex-direction:column;gap:4px;flex:1;min-width:0}
.sm-tabla-elegir-dominio{font-size:12px;font-weight:700}
.sm-mapa-tablas{display:grid;grid-template-columns:repeat(6,1fr);gap:6px;margin-bottom:6px}
.sm-mapa-celda{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;aspect-ratio:1/1;border-radius:8px;font-weight:800;background:var(--card2);border:1px solid var(--border);color:var(--muted)}
.sm-mapa-celda small{font-weight:600;font-size:9.5px;opacity:.85}
.sm-mapa-bajo{background:rgba(255,92,114,.18);border-color:var(--red);color:var(--red)}
.sm-mapa-medio{background:rgba(255,210,63,.18);border-color:var(--yellow);color:var(--yellow)}
.sm-mapa-alto{background:rgba(63,214,122,.18);border-color:var(--green);color:var(--green)}
.sm-plan-lista{display:flex;flex-direction:column;gap:8px;margin-bottom:6px}
.sm-plan-dia{display:flex;gap:10px;align-items:flex-start;background:var(--card);border:1px solid var(--border);border-radius:12px;padding:10px 12px;font-size:12.5px}
.sm-plan-dia input{margin-top:3px;flex-shrink:0}
.sm-plan-dia.hecho{border-color:var(--green);opacity:.7}
.sm-plan-dia.hecho b{text-decoration:line-through}
</style>
</head>
<body>
<div id="app"></div>

<script src="js/progreso.js"></script>
<script src="js/mundos.js"></script>
<script src="js/mascota.js"></script>
<script src="js/sonido.js"></script>
<script src="js/generadores.js"></script>
<script src="js/lecciones.js"></script>
<script src="js/tablas.js"></script>
<script src="js/juego.js"></script>
<script src="js/arcade.js"></script>
<script src="js/ui.js"></script>
<script src="js/app.js"></script>
</body>
